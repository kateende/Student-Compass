kind = "web"
previewPath = "/"
title = "Compass"
version = "1.0.0"
id = "artifacts/compass"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22639

[services.development]
run = "pnpm --filter @workspace/compass run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/compass", "run", "build" ]
publicDir = "artifacts/compass/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22639"
BASE_PATH = "/"
